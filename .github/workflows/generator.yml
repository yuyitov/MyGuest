# Sistema: books/  (genera los guest books de clientes)
name: MyGuest Generator

on:
  repository_dispatch:
    types: [new-villa]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install print dependencies
        run: |
          python -m pip install --upgrade pip
          pip install weasyprint

      # Auditoria de ataque 2026-07-23 (#1): estos valores vienen de un intake
      # externo. Interpolados directo en `run:` los sustituye GitHub antes del
      # shell -> metacaracteres = ejecucion arbitraria en el runner. Por `env:`
      # y entre comillas son datos, nunca codigo. Mismo patron que ya usan los
      # steps de abajo y los repos hermanos.
      - name: Trace dispatch payload
        env:
          SUBMISSION_ID: ${{ github.event.client_payload.metadata.submission_id }}
          SLUG: ${{ github.event.client_payload.metadata.slug }}
          SOURCE: ${{ github.event.client_payload.metadata.source }}
        run: |
          echo "submission_id=$SUBMISSION_ID"
          echo "slug=$SLUG"
          echo "source=$SOURCE"
          echo "payload_blocks=metadata,property,outputs,ingest_inputs,content"

      - name: Validate public payload shape
        env:
          PUBLIC_PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          payload = json.loads(os.environ["PUBLIC_PAYLOAD_JSON"])

          required_blocks = {"metadata", "property", "outputs", "ingest_inputs", "content"}
          missing = sorted(required_blocks - set(payload.keys()))
          if missing:
              print(f"Missing required payload blocks: {missing}")
              sys.exit(1)

          forbidden_keys = {
              "wifi_ssid",
              "wifi_password",
              "door_code",
              "building_code",
              "lockbox_code",
              "host_phone",
              "house_access_private",
              "private_notes",
              "private_access_notes",
              "private_access_details",
              "guest_access_token",
              "guest_access_url",
          }

          allowed_trace_paths = {
              "root.metadata.private_record_key",
          }

          def find_forbidden(obj, path="root"):
              hits = []

              if isinstance(obj, dict):
                  for key, value in obj.items():
                      current_path = f"{path}.{key}"
                      if key in forbidden_keys and current_path not in allowed_trace_paths:
                          hits.append(current_path)
                      hits.extend(find_forbidden(value, f"{path}.{key}"))
              elif isinstance(obj, list):
                  for i, item in enumerate(obj):
                      hits.extend(find_forbidden(item, f"{path}[{i}]"))

              return hits

          forbidden_hits = find_forbidden(payload)
          if forbidden_hits:
              print("Private fields found in public payload:")
              for hit in forbidden_hits:
                  print(f" - {hit}")
              sys.exit(1)

          print("Public payload shape validated successfully.")
          PY

      - name: Generate Villa Page
        env:
          PUBLIC_PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL_TRANSLATION: ${{ vars.OPENAI_MODEL_TRANSLATION }}
        run: |
          python books/scripts/generate_villa.py "$PUBLIC_PAYLOAD_JSON"
          
      - name: Postprocess Public Book Visual QA
        env:
          PUBLIC_PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
        run: |
          python books/scripts/postprocess_public_book.py "$PUBLIC_PAYLOAD_JSON"

      - name: Build Print PDF
        env:
          PUBLIC_PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python books/scripts/build_print_pdf.py "$PUBLIC_PAYLOAD_JSON"

      - name: QA public outputs for private data
        run: |
          python - <<'PY'
          import os
          import sys
          import re

          # These internal identifiers must NEVER appear in public HTML in any context.
          always_forbidden = [
              "guest_access_pin",
              "access_pin",
              "private_record_key",
              "priv-",
              "door_code",
              "keypad_code",
              "lockbox_code",
              "passcode",
          ]

          # These terms appear as JS property names in the Worker injection mechanism
          # (e.g. d.wifi_password, d.wifi_ssid). They are safe as code identifiers.
          # Only flag them when they appear as actual key=value data with a real value,
          # which would mean private data is hardcoded in public HTML.
          # Matches: "wifi_password": "value"  |  wifi_ssid = "value"
          # Does NOT match: d.wifi_password  |  .wifi_ssid  |  func(d.host_phone)
          _injection_terms = [
              "wifi_password",
              "wifi_ssid",
              "host_phone",
              "house_access_private",
          ]
          _value_pat = re.compile(
              r'(?<![.\w])(' + '|'.join(re.escape(t) for t in _injection_terms) + r')\s*[=:]\s*["\'][^"\']{3,}',
              re.IGNORECASE
          )

          # Official demo directories are fully exempted — they contain
          # realistic-looking but entirely fictitious credentials.
          demo_slugs = {
              "ocean-drive-retreat",
              "the-soho-loft",
              "casa-selva-tulum",
              "le-marais-flat",
          }

          public_root = "public"
          hits = []

          for root, dirs, files in os.walk(public_root):
              path_parts = root.replace("\\", "/").split("/")
              in_official_demo = any(slug in path_parts for slug in demo_slugs)

              for filename in files:
                  path = os.path.join(root, filename)

                  if filename.lower().endswith((".png", ".jpg", ".jpeg", ".webp", ".gif", ".ico", ".pdf")):
                      continue

                  try:
                      with open(path, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()
                  except Exception:
                      continue

                  if in_official_demo:
                      continue

                  for term in always_forbidden:
                      if term in content:
                          hits.append((path, term))

                  for m in _value_pat.finditer(content):
                      hits.append((path, f"{m.group(1)} (hardcoded value)"))

          if hits:
              print("Private/sensitive terms found in public outputs:")
              for path, term in hits:
                  print(f"- {path}: {term}")
              sys.exit(1)

          print("QA OK: no private/sensitive terms found in public text outputs.")
          PY

      - name: Verify no obvious secrets committed (value-shaped, not variable names)
        run: |
          # Matches secret-shaped VALUES (Stripe/SendGrid/Cloudflare/GitHub/
          # Resend/OpenAI key prefixes, PEM headers), not mere mentions of
          # words like "api_key" or "bearer" that legitimately appear in
          # code/comments/docstrings. Lesson from HMU Link: a name-based guard
          # produced a false positive that silently blocked deploy for ~1h.
          if grep -rnE "sk_live_[A-Za-z0-9]+|sk_test_[A-Za-z0-9]+|rk_live_[A-Za-z0-9]+|sk-proj-[A-Za-z0-9_-]{10,}|sk-[A-Za-z0-9]{20,}|SG\.[A-Za-z0-9_-]{16,}|whsec_[A-Za-z0-9]{8,}|cfut_[A-Za-z0-9]{8,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|re_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----" \
               books/ data/ public/ worker/ ; then
            echo "Posible secreto detectado."
            exit 1
          fi
          echo "OK: sin secrets obvios."

      # Auditoria de ataque 2026-07-23 (#1): este era el sink de mayor impacto.
      # El job tiene `contents: write` sobre un repo PUBLICO, asi que un slug
      # con metacaracteres interpolado aqui era ejecucion arbitraria con permiso
      # de push. Por `env:` + "$SLUG" el valor es un argumento, no codigo.
      - name: Commit and Push
        env:
          SLUG: ${{ github.event.client_payload.metadata.slug }}
        run: |
          git config --global user.name "MyGuest Bot"
          git config --global user.email "actions@github.com"
          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Generate villa page for $SLUG"
          git pull --rebase origin main
          git push

      # Alerta de embudo muerto (Bloque A.3): si CUALQUIER paso anterior falló,
      # el cliente ya pagó y llenó el formulario pero su guía no se generó.
      # Avisa al worker (mismo NOTIFY_SECRET de pages.yml) para que mande el
      # correo a ALERT_EMAIL. WORKER_URL es una repo var (como en pages.yml).
      - name: Alert on generation failure
        if: failure()
        env:
          WORKER_URL: ${{ vars.WORKER_URL }}
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          SLUG: ${{ github.event.client_payload.metadata.slug }}
          SUBMISSION_ID: ${{ github.event.client_payload.metadata.submission_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$WORKER_URL" ] || [ -z "$NOTIFY_SECRET" ]; then
            echo "WORKER_URL or NOTIFY_SECRET not configured — cannot alert"
            exit 0
          fi
          payload=$(jq -nc \
            --arg slug "$SLUG" \
            --arg sid "$SUBMISSION_ID" \
            --arg run "$RUN_URL" \
            --arg reason "Un paso del workflow de generación de MyGuest falló (ver el run)." \
            '{slug:$slug, submission_id:$sid, run_url:$run, reason:$reason}')
          curl -sS -X POST "${WORKER_URL}/alert-generation-failed" \
            -H "Authorization: Bearer $NOTIFY_SECRET" \
            -H "Content-Type: application/json" \
            -d "$payload" || true
