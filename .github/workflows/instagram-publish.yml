name: Instagram Auto-Publish

on:
  schedule:
    # Runs every day at 9:00 AM UTC (11:00 AM Spain / 3:00 AM Mexico)
    - cron: "0 9 * * *"
  workflow_dispatch: # allows manual trigger from GitHub Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Publish scheduled posts
        env:
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          BASE_URL: https://myguestguide.com/instagram
        run: python marketing/instagram/scripts/publish.py

      - name: Commit updated posts.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet marketing/instagram/posts.json || (
            git add marketing/instagram/posts.json &&
            git commit -m "chore: mark published posts in posts.json [skip ci]" &&
            git push
          )
