name: Deploy MyGuest Pages

on:
  push:
    branches:
      - main
    paths:
      - "public/**"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["MyGuest Generator"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify no obvious secrets committed (value-shaped, not variable names)
        run: |
          # Matches secret-shaped VALUES (Stripe/SendGrid/Cloudflare/GitHub/
          # Resend/OpenAI key prefixes, PEM headers), not mere mentions of
          # words like "api_key" or "bearer" that legitimately appear in
          # code/comments/docstrings. Lesson from HMU Link: a name-based guard
          # produced a false positive that silently blocked deploy for ~1h.
          if grep -rnE "sk_live_[A-Za-z0-9]+|sk_test_[A-Za-z0-9]+|rk_live_[A-Za-z0-9]+|sk-proj-[A-Za-z0-9_-]{10,}|sk-[A-Za-z0-9]{20,}|SG\.[A-Za-z0-9_-]{16,}|whsec_[A-Za-z0-9]{8,}|cfut_[A-Za-z0-9]{8,}|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|re_[A-Za-z0-9]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----" \
               public/ ; then
            echo "Posible secreto detectado en public/."
            exit 1
          fi
          echo "OK: sin secrets obvios."

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Notify Worker (send delivery email)
        if: success()
        env:
          NOTIFY_SECRET: ${{ secrets.NOTIFY_SECRET }}
          WORKER_URL: ${{ vars.WORKER_URL }}
        run: |
          SLUG=$(git log -1 --pretty=%s | sed -n 's/^Generate villa page for //p')

          if [ -z "${SLUG}" ]; then
            echo "Commit is not a generator commit — skipping notify"
            exit 0
          fi

          if [ -z "${WORKER_URL}" ]; then
            echo "Error: WORKER_URL not configured for generator commit" >&2
            exit 1
          fi

          if [ -z "${NOTIFY_SECRET}" ]; then
            echo "Error: NOTIFY_SECRET not configured for generator commit" >&2
            exit 1
          fi

          echo "Notifying Worker for slug: ${SLUG}"
          HTTP_CODE=$(curl --silent --show-error --max-time 30 \
            -o /tmp/notify_response.json \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${NOTIFY_SECRET}" \
            -d "{\"slug\":\"${SLUG}\"}" \
            "${WORKER_URL}/notify")
          BODY=$(cat /tmp/notify_response.json 2>/dev/null || echo "")
          echo "Worker response (HTTP ${HTTP_CODE}): ${BODY}"
          if [ "${HTTP_CODE}" -ge 500 ]; then
            echo "Worker server error — failing workflow" >&2
            exit 1
          elif [ "${HTTP_CODE}" -ge 400 ]; then
            echo "Warning: Worker returned ${HTTP_CODE} — delivery may not have been sent. Check Worker logs."
          else
            echo "Delivery notification sent successfully."
          fi
