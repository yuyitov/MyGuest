<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>MyGuest — Brand Intro</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    body { background: var(--teal); }

    .canvas {
      background: linear-gradient(180deg, #5CC8BF 0%, #2A9186 25%, #1A746E 55%, #145f5a 100%);
      position: relative;
      overflow: hidden;
    }

    /* Decorative circles */
    .deco-circle {
      position: absolute;
      width: 580px; height: 580px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
      top: -160px; right: -80px;
      pointer-events: none;
    }
    .deco-circle-2 {
      position: absolute;
      width: 260px; height: 260px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
      bottom: 60px; left: -60px;
      pointer-events: none;
    }

    /* TOP NAV — logo */
    .nav { position: absolute; top: 44px; left: 68px; z-index: 3; }
    .logo-big { height: 140px; margin-top: -30px; margin-left: -20px; }

    /* TAG PILL */
    .tag-pill {
      position: absolute; top: 140px; left: 68px;
      display: inline-flex; align-items: center; gap: 10px;
      background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.22);
      border-radius: 999px; padding: 9px 22px;
      font-size: 19px; font-weight: 600; color: rgba(255,255,255,0.9);
      z-index: 3;
    }
    .tag-pill::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--coral); flex-shrink: 0; }

    /* HEADLINE */
    .headline {
      position: absolute; top: 210px; left: 68px;
      width: 530px;
      font-size: 74px; font-weight: 900; color: white;
      line-height: 1.02; letter-spacing: -0.028em;
      z-index: 3;
    }
    .headline em { font-style: normal; color: var(--coral); }

    /* SUBTITLE — right below headline */
    .sub {
      position: absolute; top: 570px; left: 68px;
      width: 490px;
      font-size: 25px; font-weight: 400;
      color: rgba(255,255,255,0.65);
      line-height: 1.65;
      z-index: 3;
    }

    /* FEATURE CHIPS — row below subtitle */
    .chips {
      position: absolute; top: 730px; left: 68px;
      display: flex; flex-direction: column; gap: 12px;
      z-index: 3;
    }
    .chip {
      display: inline-flex; align-items: center; gap: 12px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 14px; padding: 12px 20px;
      font-size: 20px; font-weight: 600; color: white;
      width: fit-content;
    }
    .chip-icon { font-size: 22px; line-height: 1; }

    /* PHONE MOCKUP — two-layer: screenshot behind, frame on top */
    .phone-wrap {
      position: absolute;
      right: 28px; top: 180px;
      width: 395px; height: 806px;
      z-index: 4;
      transform: rotate(3deg);
      transform-origin: center top;
    }
    /* Clip region matches the SVG screen opening (scaled 348→395: ×1.1351) */
    .phone-screen-clip {
      position: absolute;
      top: 51px; left: 15px;
      width: 366px; height: 740px;
      border-radius: 48px;
      overflow: hidden;
      background: #000;
    }
    .phone-screen {
      display: block;
      width: 100%; height: auto;
    }
    .phone-frame {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      filter: drop-shadow(0 24px 48px rgba(0,0,0,0.45));
    }

    /* BOTTOM */
    .bottom {
      position: absolute; bottom: 42px; left: 68px; right: 68px;
      display: flex; justify-content: space-between; align-items: center; z-index: 5;
    }
    .cta-btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--coral); color: white;
      border-radius: 999px; padding: 16px 36px; font-size: 22px; font-weight: 800;
      box-shadow: 0 8px 28px rgba(242,144,127,0.45);
    }
    .url { font-size: 20px; color: rgba(255,255,255,0.55); font-weight: 500; }

    /* ── CORAL variant ── */
    body.v-coral { background: var(--coral); }
    .v-coral .canvas { background: linear-gradient(180deg, #FDEEE9 0%, #F8CFC5 28%, #F2907F 60%, #E06B55 100%); }
    .v-coral .deco-circle { background: rgba(255,255,255,0.18); }
    .v-coral .deco-circle-2 { background: rgba(26,116,110,0.1); }
    .v-coral .tag-pill { background: rgba(255,255,255,0.22); border-color: rgba(255,255,255,0.35); color: var(--charcoal); }
    .v-coral .tag-pill::before { background: var(--teal); }
    .v-coral .headline { color: var(--charcoal); }
    .v-coral .headline em { color: var(--teal); }
    .v-coral .sub { color: rgba(32,32,32,0.65); }
    .v-coral .chip { background: rgba(255,255,255,0.25); border-color: rgba(255,255,255,0.4); color: var(--charcoal); }
    .v-coral .cta-btn { background: var(--teal); box-shadow: 0 8px 28px rgba(26,116,110,0.4); }
    .v-coral .url { color: rgba(32,32,32,0.5); }

    /* ── DARK variant ── */
    body.v-dark { background: var(--charcoal); }
    .v-dark .canvas { background: linear-gradient(180deg, #3D3838 0%, #343030 30%, #282424 65%, #1E1A1A 100%); }
    .v-dark .deco-circle { background: radial-gradient(circle, rgba(26,116,110,0.25) 0%, transparent 70%); width: 700px; height: 700px; }
    .v-dark .deco-circle-2 { background: radial-gradient(circle, rgba(242,144,127,0.12) 0%, transparent 70%); }
    .v-dark .logo-big { filter: brightness(0) invert(1); }
    .v-dark .tag-pill { background: rgba(242,144,127,0.15); border-color: var(--coral); color: var(--coral); }
    .v-dark .tag-pill::before { background: var(--coral); }
    .v-dark .headline { color: white; }
    .v-dark .headline em { color: var(--coral); }
    .v-dark .sub { color: rgba(255,255,255,0.55); }
    .v-dark .chip { background: rgba(255,255,255,0.07); border-color: rgba(255,255,255,0.12); }
    .v-dark .url { color: rgba(255,255,255,0.4); }
  </style>
</head>
<body>
<div class="canvas" id="canvas">
  <div class="deco-circle"></div>
  <div class="deco-circle-2"></div>

  <!-- Logo -->
  <div class="nav">
    <img class="logo-big" src="../assets/logo.png" alt="MyGuest">
  </div>

  <!-- Tag -->
  <div class="tag-pill" id="tag">Digital Welcome Book</div>

  <!-- Headline -->
  <h1 class="headline" id="headline">The digital welcome book your guests will actually <em>use.</em></h1>

  <!-- Subtitle — stacked lines -->
  <p class="sub" id="subtitle">Mobile guide for your guests.<br>Everything in one link.<br>In 3 languages.</p>

  <!-- Feature chips -->
  <div class="chips">
    <div class="chip"><span class="chip-icon">📱</span>Works on any phone — no app needed</div>
    <div class="chip"><span class="chip-icon">🌍</span>EN · ES · FR</div>

  </div>

  <!-- Phone mockup: screenshot layer + frame overlay -->
  <div class="phone-wrap">
    <div class="phone-screen-clip">
      <img class="phone-screen" id="screen-img" src="../assets/mockups/coastal-hi.png" alt="MyGuest demo">
    </div>
    <img class="phone-frame" src="../assets/phone-frame.svg" alt="">
  </div>

  <!-- Bottom -->
  <div class="bottom">
    <div class="cta-btn" id="cta">See the demo →</div>
    <span class="url">myguestguide.com</span>
  </div>
</div>

<script>
(function() {
  const data = window.POST_DATA || null;
  window.addEventListener('message', function(e) { if (e.data && e.data.postData) { try { applyData(e.data.postData); } catch(er) {} } });
  if (!data) {
    const hash = window.location.hash.slice(1);
    if (hash) { try { applyData(JSON.parse(decodeURIComponent(hash))); return; } catch(e) {} }
    const params = new URLSearchParams(window.location.search);
    const key = params.get('key');
    if (key) { try { const s = localStorage.getItem(key); if(s){ localStorage.removeItem(key); applyData(JSON.parse(s)); return; } } catch(e) {} }
    const enc = params.get('data');
    if (enc) { try { applyData(JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(enc)))))); } catch(e) {} return; }
    const postId = params.get('postId');
    if (postId) { fetch('../posts.json').then(r=>r.json()).then(posts=>{ const p=posts.find(x=>x.id===postId); if(p) applyData(p); }).catch(()=>{}); }
    return;
  }
  applyData(data);

  const SCREEN_IMGS = {
    coastal:    '../assets/mockups/coastal-hi.png',
    minimalist: '../assets/mockups/minimalist-hi.png',
    sunset:     '../assets/mockups/sunset-hi.png',
    classic:    '../assets/mockups/classic-hi.png',
  };

  function applyData(p) {
    const v = p.style || 'teal';
    if (v === 'coral') document.body.classList.add('v-coral');
    else if (v === 'dark') document.body.classList.add('v-dark');

    if (p.mockup && SCREEN_IMGS[p.mockup])
      document.getElementById('screen-img').src = SCREEN_IMGS[p.mockup];

    if (p.title)    document.getElementById('headline').innerHTML = p.title;
    if (p.subtitle) document.getElementById('subtitle').innerHTML = p.subtitle;
    if (p.cta)      document.getElementById('cta').textContent = p.cta + ' →';
    if (p.tag)      document.getElementById('tag').textContent = p.tag;
  }
})();
</script>
</body>
</html>
