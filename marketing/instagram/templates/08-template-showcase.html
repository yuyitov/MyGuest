<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>MyGuest — Style Showcase</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    /* ── BASE: canvas ── */
    body { background: #1A1A1A; }
    .canvas { position: relative; overflow: hidden; background: #1A1A1A; }

    /* ── FULL-BLEED BACKGROUND PHOTO ── */
    .bg-photo {
      position: absolute; inset: 0;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 0;
    }
    /* Gradient overlay: dark at top+bottom, lighter in middle where phone is */
    .bg-photo::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(
        180deg,
        rgba(0,0,0,0.72) 0%,
        rgba(0,0,0,0.25) 40%,
        rgba(0,0,0,0.30) 60%,
        rgba(0,0,0,0.80) 100%
      );
    }

    /* ── TOP NAV ── */
    .nav {
      position: absolute; top: 52px; left: 68px; right: 68px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 5;
    }
    .style-tag {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      padding: 8px 20px;
      font-size: 17px; font-weight: 700;
      color: white; letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .url { font-size: 19px; color: rgba(255,255,255,0.5); z-index: 5; }

    /* ── HEADLINE — top left ── */
    .headline-wrap {
      position: absolute; top: 118px; left: 68px;
      z-index: 5; max-width: 520px;
    }
    .headline {
      font-size: 78px; font-weight: 900;
      color: white; line-height: 1.0;
      letter-spacing: -0.03em;
    }
    .headline em { font-style: normal; }
    .sub {
      font-size: 25px; font-weight: 400;
      color: rgba(255,255,255,0.7);
      line-height: 1.4; margin-top: 16px;
      max-width: 420px;
    }

    /* ── LARGE PHONE — right side ── */
    .phone-wrap {
      position: absolute;
      right: 40px; top: 80px;
      z-index: 4;
    }
    .iphone {
      position: relative;
      width: 340px; height: 694px;
      background: #0d0d0d;
      border-radius: 50px;
      box-shadow:
        0 0 0 2px #2a2a2a,
        0 0 0 4px #111,
        0 50px 100px rgba(0,0,0,0.6),
        0 0 60px rgba(255,255,255,0.06);
      overflow: hidden;
    }
    .iphone::before {
      content: '';
      position: absolute;
      top: 12px; left: 50%;
      transform: translateX(-50%);
      width: 96px; height: 26px;
      background: #0d0d0d;
      border-radius: 999px;
      z-index: 10;
    }
    .iphone-screen {
      position: absolute; inset: 0;
      overflow: hidden; border-radius: 50px;
    }
    .iphone-screen img {
      width: 100%; height: 100%;
      object-fit: cover; object-position: top center;
    }
    .home-bar {
      position: absolute; bottom: 8px; left: 50%;
      transform: translateX(-50%);
      width: 96px; height: 5px;
      background: rgba(255,255,255,0.3);
      border-radius: 999px; z-index: 10;
    }

    /* ── COLOR ACCENT bar on phone frame ── */
    .phone-accent {
      position: absolute;
      right: 36px; top: 76px;
      width: 348px; height: 702px;
      border-radius: 52px;
      z-index: 3;
      pointer-events: none;
    }

    /* ── BOTTOM CTA ── */
    .bottom {
      position: absolute; bottom: 52px; left: 68px; right: 68px;
      display: flex; justify-content: space-between; align-items: center;
      z-index: 5;
    }
    .cta-btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: white; color: #1A1A1A;
      border-radius: 999px;
      padding: 15px 36px;
      font-size: 22px; font-weight: 800;
    }
    .property-label {
      font-size: 20px; color: rgba(255,255,255,0.55); font-weight: 500;
    }

    /* ══ COASTAL variant ══ */
    body.v-coastal .canvas { background: #0D2B2B; }
    body.v-coastal .bg-photo { background-image: url('../assets/photos/coastal-bg.jpg'); }
    body.v-coastal .headline em { color: #7ECDC8; }
    body.v-coastal .style-tag { background: rgba(26,116,110,0.4); border-color: rgba(26,116,110,0.6); }
    body.v-coastal .phone-accent { box-shadow: 0 0 0 3px #1A746E, 0 60px 120px rgba(26,116,110,0.4); }
    body.v-coastal .cta-btn { background: var(--teal); color: white; }

    /* ══ MINIMALIST variant ══ */
    body.v-minimalist .canvas { background: #1C1C1C; }
    body.v-minimalist .bg-photo { background-image: url('../assets/photos/minimalist-bg.jpg'); }
    body.v-minimalist .headline em { color: #D4D0C8; }
    body.v-minimalist .style-tag { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.2); }
    body.v-minimalist .phone-accent { box-shadow: 0 0 0 3px rgba(255,255,255,0.3), 0 60px 120px rgba(0,0,0,0.5); }
    body.v-minimalist .cta-btn { background: white; color: #1C1C1C; }

    /* ══ SUNSET variant ══ */
    body.v-sunset .canvas { background: #2A1010; }
    body.v-sunset .bg-photo { background-image: url('../assets/photos/sunset-bg.jpg'); }
    body.v-sunset .headline em { color: var(--coral); }
    body.v-sunset .style-tag { background: rgba(242,144,127,0.25); border-color: rgba(242,144,127,0.4); }
    body.v-sunset .phone-accent { box-shadow: 0 0 0 3px #C0533C, 0 60px 120px rgba(192,83,60,0.4); }
    body.v-sunset .cta-btn { background: var(--coral); color: white; }

    /* ══ CLASSIC variant ══ */
    body.v-classic .canvas { background: #1A1822; }
    body.v-classic .bg-photo { background-image: url('../assets/photos/classic-bg.jpg'); }
    body.v-classic .headline em { color: #B8A87A; }
    body.v-classic .style-tag { background: rgba(184,168,122,0.2); border-color: rgba(184,168,122,0.4); }
    body.v-classic .phone-accent { box-shadow: 0 0 0 3px #8A7A50, 0 60px 120px rgba(61,64,91,0.5); }
    body.v-classic .cta-btn { background: #8A7A50; color: white; }
  </style>
</head>
<body>
<div class="canvas" id="canvas">
  <div class="bg-photo" id="bg-photo"></div>

  <div class="nav">
    <span class="style-tag" id="style-tag">Coastal style</span>
    <span class="url">myguestguide.com</span>
  </div>

  <div class="headline-wrap">
    <h1 class="headline" id="headline">Made for<br>properties<br>by the <em>sea.</em></h1>
    <p class="sub" id="subtitle">Light, airy, and calm — the Coastal style fits any ocean or lakeside property.</p>
  </div>

  <!-- Large phone -->
  <div class="phone-accent"></div>
  <div class="phone-wrap">
    <div class="iphone">
      <div class="iphone-screen">
        <img id="phone-img" src="../assets/mockups/coastal-hi.png" alt="MyGuest guide">
      </div>
      <div class="home-bar"></div>
    </div>
  </div>

  <div class="bottom">
    <div class="cta-btn" id="cta">See live demo →</div>
    <span class="property-label" id="property-label">Ocean Drive Retreat</span>
  </div>
</div>
<script>
(function() {
  const MOCKUP_MAP = {
    coastal: '../assets/mockups/coastal-hi.png',
    minimalist: '../assets/mockups/minimalist-hi.png',
    sunset: '../assets/mockups/sunset-hi.png',
    classic: '../assets/mockups/classic-hi.png',
  };
  // Also try inner-page screenshots
  const SCREENSHOT_MAP = {
    coastal:    '../assets/screenshots/ocean-drive-retreat/',
    minimalist: '../assets/screenshots/the-soho-loft/',
    sunset:     '../assets/screenshots/casa-selva-tulum/',
    classic:    '../assets/screenshots/le-marais-flat/',
  };

  const data = window.POST_DATA || null;
  window.addEventListener('message', function(e) { if (e.data && e.data.postData) { try { applyData(e.data.postData); } catch(er) {} } });
  if (!data) {
    const hash = window.location.hash.slice(1);
    if (hash) { try { applyData(JSON.parse(decodeURIComponent(hash))); return; } catch(e) {} }
    const params = new URLSearchParams(window.location.search);
    const key = params.get('key');
    if (key) { try { const s = localStorage.getItem(key); if(s){ localStorage.removeItem(key); applyData(JSON.parse(s)); return; } } catch(e) {} }
    const enc = params.get('data');
    if (enc) { try { applyData(JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(enc)))))); } catch(e) {} return; }
    const postId = params.get('postId');
    if (postId) { fetch('../posts.json').then(r=>r.json()).then(posts=>{ const p=posts.find(x=>x.id===postId); if(p) applyData(p); }).catch(()=>{}); }
    return;
  }
  applyData(data);

  function applyData(p) {
    // style = "coastal" | "minimalist" | "sunset" | "classic"
    const parts = (p.style || 'coastal').split('-');
    const styleName = parts[0];

    document.body.className = 'v-' + styleName;

    // Set phone image — prefer inner-page screenshot if specified, else mockup
    const phoneImg = document.getElementById('phone-img');
    if (p.screen && SCREENSHOT_MAP[styleName]) {
      phoneImg.src = SCREENSHOT_MAP[styleName] + p.screen + '.png';
    } else if (MOCKUP_MAP[styleName]) {
      phoneImg.src = MOCKUP_MAP[styleName];
    }

    if (p.title)    document.getElementById('headline').innerHTML = p.title;
    if (p.subtitle) document.getElementById('subtitle').textContent = p.subtitle;
    if (p.cta)      document.getElementById('cta').textContent = p.cta + ' →';
    if (p.tag)      document.getElementById('style-tag').textContent = p.tag;
    if (p.property) document.getElementById('property-label').textContent = p.property;
  }
})();
</script>
</body>
</html>
